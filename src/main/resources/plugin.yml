name: CdrJobs
version: '1.6.0'
main: store.cadera.cdrjobs.CdrJobsPlugin
api-version: '1.21'
author: CADERA
description: Fantasy profession progression system by CADERA. Public API v2, aesthetic hardened GUI, Five Paths, Fate Resonance, Profession Contracts, Mastery, Adventurer Profile, leaderboards, Rite of Rebirth, Fate Essence and trials.
softdepend: [PlaceholderAPI, Vault]
commands:
  cdrjobs:
    aliases: [jobs, cjobs]
    description: Open CdrJobs, Fate Resonance, contracts, mastery, profile, leaderboards, Rite of Rebirth, or profession progression.
    usage: /cdrjobs
  cdrjobsadmin:
    aliases: [cjobsadmin]
    description: CdrJobs administration and diagnostics.
    permission: cdrjobs.admin
permissions:
  cdrjobs.use:
    default: true
  cdrjobs.rebirth:
    default: true
  cdrjobs.profile.others:
    default: true
  cdrjobs.admin:
    default: op
