name: CdrJobs
version: '1.1.1'
main: store.cadera.cdrjobs.CdrJobsPlugin
api-version: '1.21'
author: CADERA
description: Fantasy profession progression system by CADERA. Five Paths, Adventurer Profile, cached leaderboards, Fate Essence, trials and public API.
softdepend: [PlaceholderAPI]
commands:
  cdrjobs:
    aliases: [jobs, cjobs]
    description: Open CdrJobs, Adventurer Profile, leaderboards, or inspect profession progression.
    usage: /cdrjobs
  cdrjobsadmin:
    aliases: [cjobsadmin]
    description: CdrJobs administration and diagnostics.
    permission: cdrjobs.admin
permissions:
  cdrjobs.use:
    default: true
  cdrjobs.profile.others:
    default: true
  cdrjobs.admin:
    default: op
