  trials: { trial-of-seed: { harvests: 500 }, trial-of-gaia: { harvests: 2000, rare-harvests: 250 } }
  abilities: { verdant-bloom: { duration-seconds: 20, cooldown-seconds: 300, xp-bonus-percent: 25.0 } }
hunter:
  enabled: true
  xp-multiplier: 1.0
  xp: { ZOMBIE: 5, SKELETON: 6, CREEPER: 7, SPIDER: 5, CAVE_SPIDER: 6, DROWNED: 7, HUSK: 6, STRAY: 7, BLAZE: 10, ENDERMAN: 10, PIGLIN_BRUTE: 14, WITHER_SKELETON: 12, GUARDIAN: 10, ELDER_GUARDIAN: 40, RAVAGER: 30, EVOKER: 25, WITHER: 120, WARDEN: 150 }
