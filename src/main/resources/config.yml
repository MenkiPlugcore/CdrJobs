    afk-after-seconds: 600
  trials:
    trial-of-tide: { catches: 250 }
    trial-of-abyss: { catches: 1000, treasures: 50, ocean-catches: 100 }
  abilities:
    oceans-call: { duration-seconds: 20, cooldown-seconds: 300, xp-bonus-percent: 25.0 }
anti-exploit: { placed-ore-tracking: true, piston-move-tracking: true, cleanup-exploded-ores: true }
