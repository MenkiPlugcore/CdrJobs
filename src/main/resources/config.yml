  anti-exploit: { piston-tracking: true }
  trials: { trial-of-timber: { logs: 750 }, trial-of-ancient-grove: { logs: 3000, elder-logs: 300 } }
  abilities: { grove-rhythm: { duration-seconds: 20, cooldown-seconds: 300, xp-bonus-percent: 25.0 } }
fisher:
  enabled: true
  xp-multiplier: 1.0
  treasure-xp: 20
  xp: { COD: 5, SALMON: 6, TROPICAL_FISH: 10, PUFFERFISH: 12 }
