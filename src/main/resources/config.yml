# CdrJobs v0.1.2 — RUNEBOUND TEMPERING
# MENKIESTES SOFTWARE / CADERA

settings:
  max-level: 100
  actionbar-xp: true
  levelup-sound: true
  save-on-disable: true

  # Default values preserve the original v0.1.x XP curve:
  # required XP = base + linear*(level-1) + quadratic*(level-1)^2
  xp-curve:
    base-xp: 100
    linear-growth: 0
    quadratic-growth: 15

# Fate Essence is intentionally scarce. Players must choose their build carefully.
fate-essence-milestones:
  10: 1
  25: 1
  45: 1
  70: 1
  100: 2

miner:
  enabled: true

  # Global tuning knob for Miner activity XP without editing every ore entry.
  xp-multiplier: 1.0

  xp:
    COAL_ORE: 4
    DEEPSLATE_COAL_ORE: 5
    COPPER_ORE: 4
    DEEPSLATE_COPPER_ORE: 5
    IRON_ORE: 6
    DEEPSLATE_IRON_ORE: 7
    GOLD_ORE: 8
    DEEPSLATE_GOLD_ORE: 9
    REDSTONE_ORE: 5
    DEEPSLATE_REDSTONE_ORE: 6
    LAPIS_ORE: 7
    DEEPSLATE_LAPIS_ORE: 8
    DIAMOND_ORE: 20
    DEEPSLATE_DIAMOND_ORE: 22
    EMERALD_ORE: 25
    DEEPSLATE_EMERALD_ORE: 28
    NETHER_GOLD_ORE: 6
    NETHER_QUARTZ_ORE: 5
    ANCIENT_DEBRIS: 35

  trials:
    trial-of-stone:
      total-ores: 500
    trial-of-the-deep:
      deep-ores: 1200
      rare-ores: 80
      ancient-debris: 10

  abilities:
    runic-surge:
      duration-seconds: 20
      cooldown-seconds: 300
      xp-bonus-percent: 25.0
      haste-level: 1

anti-exploit:
  # Ore placed by a player never grants profession XP or trial progress when broken.
  # Coordinates are persisted in SQLite, so restarting the server does not bypass this protection.
  placed-ore-tracking: true

  # Keeps placed-ore identity when pistons move tracked ores.
  piston-move-tracking: true

  # Removes stale placed-ore coordinates when an explosion destroys them.
  cleanup-exploded-ores: true
