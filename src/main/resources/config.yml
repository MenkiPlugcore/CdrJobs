  trials: { trial-of-fang: { kills: 300 }, trial-of-crimson-moon: { kills: 1200, night-kills: 250, dangerous-kills: 10 } }
  abilities: { crimson-hunt: { duration-seconds: 20, cooldown-seconds: 300, xp-bonus-percent: 25.0 } }
lumberjack:
  enabled: true
  xp-multiplier: 1.0
