name: Build CdrJobs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: CdrJobs-0.1.0
          path: target/CdrJobs-0.1.0.jar
