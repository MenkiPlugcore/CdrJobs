name: Build CdrJobs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn -B clean verify
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: CdrJobs-production-candidate
          path: target/CdrJobs-*.jar
          if-no-files-found: error
          retention-days: 14
