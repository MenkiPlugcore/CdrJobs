name: Build CdrJobs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn -B clean verify

      - name: Verify production JAR
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' src/main/resources/plugin.yml | head -n1 | cut -d':' -f2- | tr -d " '\"\r")"
          test -n "$VERSION"
          JAR="target/CdrJobs-${VERSION}.jar"
          test -f "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Eq "^version: '?${VERSION}'?$"
          test -f "RELEASE_NOTES_v${VERSION}.md"
          sha256sum "$JAR"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: CdrJobs-production-candidate
          path: target/CdrJobs-*.jar
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified plugin jar
        uses: actions/download-artifact@v4
        with:
          name: CdrJobs-production-candidate
          path: artifact

      - name: Publish GitHub Release if version is new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(grep -E '^version:' src/main/resources/plugin.yml | head -n1 | cut -d':' -f2- | tr -d " '\"\r")"
          test -n "$VERSION"

          TAG="cdrjobs-v${VERSION}"
          NOTES="RELEASE_NOTES_v${VERSION}.md"
          JAR="artifact/CdrJobs-${VERSION}.jar"
          CHECKSUM="${JAR}.sha256"

          test -f "$NOTES"
          test -f "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Eq "^version: '?${VERSION}'?$"
          sha256sum "$JAR" > "$CHECKSUM"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving the published release untouched."
            exit 0
          fi

          TITLE="$(head -n1 "$NOTES" | sed 's/^# //')"
          test -n "$TITLE"

          gh release create "$TAG" "$JAR" "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --latest
